[project]
name = "laya-agent"
version = "0.1.0"
description = "Screen agent: Windows UI Automation perception + Laya typed decisions + PySide6 chat"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.32.0",
    "laya>=0.3.4",
    "mss>=10.2.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
    "pyside6>=6.11.2",
    "pywin32>=312",
    "safetensors>=0.8.0",
    "torch>=2.11.0",
    "transformers>=5.17.0",
    "uiautomation>=2.0.29",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
